[workspace]
members = [".", "android/rust"]

[package]
name = "mcrtc"
version = "0.1.0"
edition = "2021"

[features]
default = ["gui"]
# The egui window. Off for the Android library, which brings its own interface.
gui = ["dep:eframe"]

[dependencies]
rand = "0.10.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# No `default_fonts`: the window installs Monocraft and clears everything else anyway.
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "glow",
    "wayland",
    "x11",
] }
flate2 = "1.1.11"
# The protocol core under `webrtc`, used directly only for the two types `webrtc` does not
# re-export (`CertificateParams` and `MulticastDnsMode`). Keep it on the same version as `webrtc`,
# or the whole protocol stack gets compiled twice.
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only what the code uses; `full` would also bring fs, process and stdin.
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21.1"


# The crypto stack dominates loopback test time, so optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = "0.37"

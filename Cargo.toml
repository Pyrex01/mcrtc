[package]
name = "mcrtc"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.10.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
flate2 = "1.1.11"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21.1"


# The crypto stack dominates loopback test time, so optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = "0.37"

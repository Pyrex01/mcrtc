[package]
name = "mcrtc-android"
version.workspace = true
edition.workspace = true
description = "The mcrtc tunnel core for the Android app, exposed to Kotlin through UniFFI"
publish = false

[lib]
name = "mcrtc_android"
# cdylib for the app, lib for the tests.
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
mcrtc = { path = "../..", default-features = false }
anyhow.workspace = true
# The runtime builder; everything else comes through mcrtc.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
# Scaffolding only. The bindings generator is the `mcrtc-bindgen` crate next door.
uniffi.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }

[package]
name = "mcrtc-bindgen"
version.workspace = true
edition.workspace = true
description = "Generates the Kotlin bindings for mcrtc-android: cargo run -p mcrtc-bindgen -- generate --library ..."
publish = false

# A crate of its own, so generating bindings never compiles the tunnel for this computer.
[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }

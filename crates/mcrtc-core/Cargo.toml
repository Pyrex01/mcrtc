[package]
name = "mcrtc-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mcrtc_core"
path = "src/lib.rs"

[dependencies]
rand = "0.10.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
webrtc = "0.21.1"


name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: mcrtc-linux-x86_64, binary: mcrtc }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: mcrtc-windows-x86_64.exe, binary: mcrtc.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: mcrtc-macos-arm64, binary: mcrtc }
          - { os: macos-latest, target: x86_64-apple-darwin, name: mcrtc-macos-x86_64, binary: mcrtc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MCRTC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          MCRTC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MCRTC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MCRTC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ../mcrtc-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mcrtc-android.apk
          path: mcrtc-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
